function ctl(){const q=st.question,n=st.total||quiz.questions.length,s=st.qstatus||'ready',fin=st.status==='finished',idx=q?q.index:-1,hasNext=idx+1<n;if(fin)return '<h3>QUIZ FINISHED</h3>';
 const num=s==='ready'?1:idx+1,main=s==='ready'?'<button id=sq>START QUESTION</button>':s==='active'?'<button id=fq>FINISH QUESTION</button>':hasNext?'<button id=sq>START NEXT QUESTION</button>':'<p class=mut>That was the last question.</p>';
 return `<h3>Question ${num} / ${n}</h3><p>Status: <span class="pill ${s}">${s.toUpperCase()}</span></p>${s!=='ready'?`<p>Responses: <b>${st.received||0} / ${st.eligible||0}</b>${st.all&&s==='active'?' · <b class=good>✓ All responses received</b>':''}</p>`:`<p class=mut>Eligible: ${st.eligible||0}</p>`}${st.err?`<p class=err>${h(st.err)}</p>`:''}
  <div class=row>${main}<button class="danger sm" id=fz2 style="margin-left:auto">FINISH QUIZ</button></div>`}
function adminRender(){const qz=quiz,qr=`${location.origin}/#/play/${qz.join_code}`;
 app.innerHTML=`<div class=bar>${go('← All quizzes','#/admin')}</div><h1>${h(qz.title)}</h1><div class=card>Join code <b style="font-size:1.6em">${qz.join_code}</b> · Display code <b style="font-size:1.6em">${qz.display_code}</b><br><span class=mut>Players: ${h(qr)} · Big screen: ${h(location.origin)}/#/display</span><br><img id=qr alt="QR code to join" width=160 height=160><div class=bar><button type=button class="btn pri" data-open="${h(location.origin)}/#/display/${h(qz.display_code)}">Open big screen</button><button type=button class="btn" data-copy="${h(qz.join_code)}">Copy join code</button><button type=button class="btn" data-copy="${h(qz.display_code)}">Copy display code</button><button type=button class="btn" data-copy="${h(qr)}">Copy player link</button></div></div>
 <div class=card id=live></div><div class=card><h3>Danger zone</h3><div class=row><button class=sec id=rst>RESTART QUIZ</button><button class=danger id=del>DELETE QUIZ</button></div></div><div class=card><h3>Configuration</h3>${cfgOpts()}<button class=sec id=ss>Save settings</button><p class=mut id=sm></p></div>
 <div class=card><h3>Questions (${qz.questions.length})</h3>${qz.questions.map((x,i)=>`<div><b>${i+1}.</b> <span class=mut>[${h(x.category)}]</span> ${h(x.question_text)} <span class=mut>(${x.marks}pts)</span> <button class="sec sm" data-u="${i}" aria-label="Move up">↑</button> <button class="sec sm" data-dn="${i}" aria-label="Move down">↓</button> <button class="sec sm" data-e="${i}">Edit</button> <button class="sec sm" data-i="${x.id}">${x.image_url?'Change image':'Add image'}</button> <button class="sec sm" data-d="${x.id}">Delete</button>${x.image_url?`<br><img src="${h(x.image_url)}" alt="" style="max-height:70px">`:''}<br>${x.options.map(o=>(o.is_correct?'✔ ':'• ')+h(o.option_text)).join(' &nbsp; ')}</div>`).join('<hr>')}</div>
 <div class=card><h3>Add question</h3><input id=cat placeholder="Category" list=cats value=General><datalist id=cats>${[...new Set(qz.questions.map(x=>x.category))].map(c=>`<option>${h(c)}`).join('')}</datalist><input id=qt placeholder="Question"><input id=o1 placeholder="Option 1 (correct)"><input id=o2 placeholder="Option 2"><input id=o3 placeholder="Option 3 (optional)"><input id=o4 placeholder="Option 4 (optional)"><input id=mk type=number placeholder=Marks value=10><button id=aq>Add</button><p class=err id=e></p></div>
 <div class=card><h3>Bulk add questions</h3><p class=mut>Category | Question | Correct | Wrong 1 | Wrong 2 | Wrong 3</p><textarea id=bulk rows=6></textarea><button id=bi>Import</button><p id=bm></p></div>
 <div class=card><h3>Live scoreboard</h3><div id=sb style="max-height:50vh;overflow:auto"></div></div><div class=card><h3>Reports</h3><button class=sec id=lr>Responses</button><button class=sec id=lc>Category scores</button><div id=rs style="overflow-x:auto"></div></div>`;
 const sizes=String(qz.allowed_team_sizes||'1').split(',').map(Number);[1,2,3,4].forEach(n=>$('#sz'+n).checked=sizes.includes(n));$('#dm').value=qz.display_mode||'full';
 api(`/quizzes/${qz.id}/qr?base=${encodeURIComponent(location.origin)}`).then(r=>{$('#qr').src=r.dataUrl}).catch(()=>{});
 const reload=async()=>{window.quiz=await api('/quizzes/'+qz.id);adminRender()},move=async(i,d)=>{const ids=qz.questions.map(x=>x.id),j=i+d;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await api(`/quizzes/${qz.id}/reorder`,'POST',{ids});reload()};
 $('#rst').onclick=()=>doRestart(qz.id);$('#del').onclick=()=>doDelete(qz.id,qz.join_code);
 $('#ss').onclick=async()=>{try{await api(`/quizzes/${qz.id}/settings`,'PUT',cfgBody());$('#sm').textContent='Saved'}catch(e){$('#sm').textContent=e.message}};
 app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(+b.dataset.dn,1));
 app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const fi=document.createElement('input');fi.type='file';fi.accept='image/png,image/jpeg,image/webp';fi.onchange=async()=>{const file=fi.files[0];if(!file)return;try{const r=await fetch('/api/questions/'+b.dataset.i+'/image',{method:'POST',headers:{'Content-Type':file.type,Authorization:'Bearer '+tok},body:file});if(!r.ok)throw new Error((await r.json()).error);reload()}catch(e){alert(e.message)}};fi.click()});
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('/questions/'+b.dataset.d,'DELETE');reload()});
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const x=qz.questions[+b.dataset.e],cat=prompt('Category',x.category);if(cat===null)return;const t=prompt('Question text',x.question_text);if(t===null)return;
  const o=prompt('Options separated by | (correct FIRST)',[...x.options].sort((a,b)=>b.is_correct-a.is_correct).map(o=>o.option_text).join(' | '));if(o===null)return;
  try{await api('/questions/'+x.id,'PUT',{category:cat,question_text:t,options:o.split('|').map(s=>s.trim()).filter(Boolean),correct:0,marks:+prompt('Marks',x.marks)});reload()}catch(e){alert(e.message)}});
 $('#aq').onclick=async()=>{try{await api(`/quizzes/${qz.id}/questions`,'POST',{category:$('#cat').value,question_text:$('#qt').value,options:[1,2,3,4].map(i=>$('#o'+i).value.trim()).filter(Boolean),correct:0,marks:+$('#mk').value});reload()}catch(e){$('#e').textContent=e.message}};
 $('#bi').onclick=async()=>{try{const r=await api(`/quizzes/${qz.id}/import`,'POST',{text:$('#bulk').value,marks:+$('#mk').value||10});$('#bm').textContent=`Added ${r.added}, skipped ${r.skipped}`;setTimeout(reload,1000)}catch(e){$('#bm').textContent=e.message}};
 $('#lc').onclick=async()=>{const r=await api(`/quizzes/${qz.id}/categories`),cats=[...new Set(r.map(x=>x.category))],ps={};r.forEach(x=>(ps[x.name]=ps[x.name]||{})[x.category]=x.score);
  $('#rs').innerHTML=`<table><tr><th>Name</th>${cats.map(c=>`<th>${h(c)}</th>`).join('')}</tr>${Object.entries(ps).map(([n,v])=>`<tr><td>${h(n)}</td>${cats.map(c=>`<td>${v[c]||0}</td>`).join('')}</tr>`).join('')}</table>`};
 $('#lr').onclick=async()=>{const r=await api(`/quizzes/${qz.id}/responses`);$('#rs').innerHTML=`<table><tr><th>Q</th><th>Name</th><th>Answer</th><th>OK</th><th>Pts</th></tr>${r.map(x=>`<tr><td>${x.q}</td><td>${h(x.name)}</td><td>${h(x.answer)}</td><td>${x.is_correct?'✅':'❌'}</td><td>${x.score}</td></tr>`).join('')}</table>`};
 adminLive()}
function adminLive(){const l=$('#live');if(!l)return;l.innerHTML=ctl();$('#sb').innerHTML=lb();const lock=st.status&&st.status!=='draft';document.querySelectorAll('#sz1,#sz2,#sz3,#sz4,#dm,#ss').forEach(e=>e.disabled=lock);
 const on=(id,ev)=>$(id)&&($(id).onclick=()=>{st.err=null;sock.emit(ev)});on('#sq','admin:start_question');on('#fq','admin:finish_question');
 $('#fz2')&&($('#fz2').onclick=()=>{if(confirm('Finish Quiz?\n\nThis will permanently end the test for all participants.'))sock.emit('admin:finish_quiz')})}
addEventListener('hashchange',route);route();
</script></body></html>
